<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Adesivo oval — Barrio cordel</title>
<link rel="stylesheet" href="../../marca/barrio.css">
<link rel="stylesheet" href="../../marca/simbolos.css">
<style>
  /* Adesivo oval 2400x1800. Gravura de cordel das portas do Barrio no centro. */
  .peca::before { display: none; }
  .adesivo { width: 2400px; height: 1800px; }
  svg { position: absolute; inset: 0; }
  .gravura { position: absolute; left: 50%; top: 50%; width: 1300px; aspect-ratio: 900/560; transform: translate(-50%, -60%);
             background: url("../../marca/simbolos/xilo-barrio.svg") center / 100% 100%; }
  .logo-selo { position: absolute; left: 50%; top: 70px; z-index: 2; width: 320px; height: 320px; margin-left: -160px; border-radius: 50%;
               background: #e2a210; display: grid; place-items: center; border: 10px solid #4a2a1a; }
  .logo-selo img { width: 66%; }
  .faixa10 { position: absolute; left: 50%; top: 1140px; transform: translateX(-50%); border: 6px solid #f6ecd6; outline: 4px solid #4a2a1a; background: #4a2a1a; color: #f6ecd6;
             padding: 26px 60px 16px; white-space: nowrap; font: 700 56px/1 "Josefin Sans", sans-serif; letter-spacing: 6px; }
  .faixa10 b { font: 400 76px/1 "Alfa Slab One", serif; color: #e2a210; letter-spacing: 2px; margin-right: 18px; }
</style>
</head>
<body>
<div class="peca adesivo" data-estatico data-transparente>
  <svg viewBox="0 0 2400 1800">
    <defs>
      <pattern id="az" width="150" height="150" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#b87a06" stroke-opacity=".42" stroke-width="5"><path d="M75 12 138 75 75 138 12 75Z"/><circle cx="75" cy="75" r="20"/>
        <path d="M0 0Q38 38 0 75M150 0Q112 38 150 75M0 75Q38 112 0 150M150 75Q112 112 150 150"/></g>
        <g fill="#4a2a1a" fill-opacity=".28"><path d="M75 38 84 53H66Z"/><path d="M75 112 84 97H66Z"/><path d="M38 75 53 66V84Z"/><path d="M112 75 97 66V84Z"/>
        <circle cx="0" cy="0" r="8"/><circle cx="150" cy="0" r="8"/><circle cx="0" cy="150" r="8"/><circle cx="150" cy="150" r="8"/></g>
      </pattern>
      <mask id="so-meio"><ellipse cx="1200" cy="900" rx="1080" ry="780" fill="#000"/><ellipse cx="1200" cy="820" rx="860" ry="560" fill="#fff"/></mask>
      <filter id="papel"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .29 0 0 0 0 .16 0 0 0 0 .1 0 0 0 .08 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
      <path id="baixo" d="M 150 900 A 1050 780 0 0 0 2250 900"/>
    </defs>
    <ellipse cx="1200" cy="900" rx="1190" ry="890" fill="#4a2a1a"/>
    <ellipse cx="1200" cy="900" rx="1140" ry="840" fill="#f7c535"/>
    <ellipse cx="1200" cy="900" rx="1100" ry="800" fill="#4a2a1a"/>
    <ellipse cx="1200" cy="900" rx="1080" ry="780" fill="#f6ecd6"/>
    <ellipse cx="1200" cy="900" rx="1080" ry="780" fill="url(#az)" mask="url(#so-meio)"/>
    <ellipse cx="1200" cy="900" rx="1080" ry="780" fill="#f6ecd6" filter="url(#papel)"/>
    <ellipse cx="1200" cy="900" rx="1040" ry="740" fill="none" stroke="#4a2a1a" stroke-width="6"/>
    <text font-family="Josefin Sans" font-weight="700" font-size="70" fill="#4a2a1a" letter-spacing="5" text-anchor="middle" dy="-72"><textPath href="#baixo" startOffset="50%">AV. DR. JOAQUIM NABUCO, 5 · VARADOURO · OLINDA-PE</textPath></text>
  </svg>
  <div class="gravura"></div>
  <div class="faixa10"><b>10 ANOS</b>2016 – 2026</div>
  <div class="logo-selo"><img src="../../marca/logo/barrio-logo-marrom.png" alt="Barrio Café e Bar"></div>
</div>
</body>
</html>
