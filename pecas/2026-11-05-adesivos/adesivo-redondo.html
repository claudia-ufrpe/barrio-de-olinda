<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Adesivo redondo — Barrio</title>
<link rel="stylesheet" href="../../marca/barrio.css">
<link rel="stylesheet" href="../../marca/simbolos.css">
<style>
  /* Adesivo redondo 2000x2000 (imprime ~10 cm a 500 dpi). Fundo fora do círculo transparente = linha de corte. */
  .peca::before { display: none; }
  .adesivo { width: 2000px; height: 2000px; }
  svg { position: absolute; inset: 0; }
  .logo { position: absolute; left: 50%; top: 50%; width: 1080px; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div class="peca adesivo" data-estatico data-transparente>
  <svg viewBox="0 0 2000 2000">
    <defs>
      <pattern id="az" width="160" height="160" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#4a2a1a" stroke-opacity=".10" stroke-width="5"><path d="M80 14 146 80 80 146 14 80Z"/><circle cx="80" cy="80" r="22"/></g>
      </pattern>
      <radialGradient id="am" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#fbd25a"/><stop offset=".6" stop-color="#f7c535"/><stop offset="1" stop-color="#e2a210"/></radialGradient>
      <path id="baixo" d="M 196 1000 A 804 804 0 0 0 1804 1000"/>
      <path id="cima" d="M 165 1000 A 835 835 0 0 1 1835 1000"/>
    </defs>
    <circle cx="1000" cy="1000" r="990" fill="#4a2a1a"/>
    <circle cx="1000" cy="1000" r="960" fill="#f6ecd6"/>
    <circle cx="1000" cy="1000" r="930" fill="none" stroke="#4a2a1a" stroke-width="8"/>
    <circle cx="1000" cy="1000" r="730" fill="#e2a210"/>
    <circle cx="1000" cy="1000" r="730" fill="url(#az)"/>
    <circle cx="1000" cy="1000" r="730" fill="none" stroke="#4a2a1a" stroke-width="16"/>
    <text font-family="Alfa Slab One" font-size="92" fill="#4a2a1a" letter-spacing="10" text-anchor="middle"><textPath href="#cima" startOffset="50%">10 ANOS · 2016 – 2026</textPath></text>
    <text font-family="Josefin Sans" font-weight="700" font-size="62" fill="#4a2a1a" letter-spacing="3" text-anchor="middle" dy="52"><textPath href="#baixo" startOffset="50%">AV. DR. JOAQUIM NABUCO, 5 · VARADOURO · OLINDA</textPath></text>
    <g fill="#e2a210"><circle cx="150" cy="1000" r="16"/><circle cx="1850" cy="1000" r="16"/></g>
  </svg>
  <img class="logo" src="../../marca/logo/barrio-logo-marrom.png" alt="Barrio Café e Bar">
</div>
</body>
</html>
