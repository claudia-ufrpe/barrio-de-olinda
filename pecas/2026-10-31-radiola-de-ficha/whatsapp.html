<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WhatsApp — Radiola de Ficha</title>
<link rel="stylesheet" href="../../marca/barrio.css">
<link rel="stylesheet" href="../../marca/simbolos.css">
<link rel="stylesheet" href="retro.css">
<link rel="stylesheet" href="radiola.css">
<style>.whats{width:1080px;height:1350px}
.topo{position:absolute;top:40px;left:50px} .sexta{font-size:34px} .titulo{font-size:118px;margin-top:10px}
.raios{top:0;left:-200px;width:1400px;height:1400px}
.radiola,.lampadas{top:330px;left:300px;width:500px;height:610px}
.cantor{top:330px;left:330px;width:440px;-webkit-mask:linear-gradient(#000 88%,transparent 99%)}
.ao-vivo{top:560px;left:40px;font-size:32px;transform:rotate(-4deg)}
.no-barrio{top:70px;right:50px;font-size:32px}
.lampadas.b{display:none}
.cartao{left:40px;right:40px;top:960px} .cartao .escolhe{font-size:46px;padding:22px 20px 16px}
.cartao strong{font-size:54px} .cartao small{font-size:24px} .cartao .linha-info div{padding:14px 6px 10px} .cartao .massa{font-size:38px;padding:16px 0 12px}</style>
</head>
<body>
<div class="peca whats amarelo" data-estatico>
  <div class="raios"></div>
  <div class="radiola"></div>
  <div class="lampadas"></div><div class="lampadas b"></div>
  <img class="cantor" src="../../fotos/baracho-recorte.png" alt="Baracho">
  <div class="topo">
    <div class="sexta">BARACHO APRESENTA</div>
    <div class="titulo">Radiola<br>de Ficha</div>
  </div>
  <div class="no-barrio">NO BARRIO</div>
  <div class="ao-vivo">AO VIVO<br>VOZ E<br>VIOLÃO</div>
  <div class="cartao">
    <div class="escolhe">Você escolhe a música e ele toca</div>
    <div class="linha-info"><div><small>SÁBADO</small><strong>31/10</strong></div><div><small>A PARTIR DAS</small><strong>16h</strong></div><div><small>COUVERT</small><strong>R$ 15</strong></div></div>
    <div class="massa">Vai ser muito massa</div>
  </div>
</div>
</body>
</html>
