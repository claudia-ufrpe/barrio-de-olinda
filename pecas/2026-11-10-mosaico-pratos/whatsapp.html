<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>WhatsApp — Mosaico de pratos</title>
<link rel="stylesheet" href="../../marca/barrio.css"><link rel="stylesheet" href="../../marca/simbolos.css"><link rel="stylesheet" href="mosaico.css">
<style>
.quad { width:1080px; height:1080px; }
.cab { position:absolute; top:30px; left:40px; }
.cab small { font-size:28px; } .cab h1 { font-size:82px; margin-top:8px; }
.logo-barrio { top:24px; right:30px; width:130px; height:130px; }
.p1 { left:30px; width:560px; top:190px; height:800px; transform:rotate(-1deg); }
.p1 img { object-position:50% 55%; }
.p2 { right:30px; width:450px; top:180px; height:395px; transform:rotate(1.2deg); }
.p3 { right:30px; width:450px; top:600px; height:395px; transform:rotate(-1deg); }
.prato .nome { font-size:36px; padding:14px 8px 8px; }
.p3 .nome { font-size:30px; }
.fecho { top:1020px; font-size:38px; }
</style></head><body>
<div class="peca quad amarelo" data-estatico>
  <div class="cab"><small>TEM NO BARRIO</small><h1>Pratos da casa</h1></div>
  <div class="logo-barrio"><img src="../../marca/logo/barrio-logo-creme.png" alt="Barrio Café e Bar"></div>
  <div class="prato p1"><div class="janela"><img src="../../fotos/porco-guisado.jpg" alt=""><div class="nome">PORCO GUISADO</div></div></div>
  <div class="prato p2"><div class="janela"><img src="../../fotos/caldeirada-prato.jpg" alt=""><div class="nome">CALDEIRADA</div></div></div>
  <div class="prato p3"><div class="janela"><img src="../../fotos/bacalhau-coco.jpg" alt="" style="object-position:60% 40%"><div class="nome">BACALHAU AO<br>MOLHO DE COCO</div></div></div>
  <div class="fecho">Vem almoçar com a gente.</div>
</div></body></html>
