<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post — Dobradinha</title>
<link rel="stylesheet" href="../../marca/barrio.css">
<style>
  .foto { top: 0; left: 0; width: 1080px; height: 800px; border: 0; border-bottom: 12px solid var(--creme); box-shadow: none; }
  .logo-selo { position: absolute; top: 36px; left: 36px; width: 210px; height: 210px; border-radius: 50%;
               background: var(--mostarda); display: grid; place-items: center;
               box-shadow: 0 10px 24px rgba(0, 0, 0, .3); }
  .logo-selo img { width: 136px; }
  .selo { top: 680px; right: 60px; width: 200px; height: 200px; font-size: 44px; }
  .texto { position: absolute; top: 812px; bottom: 96px; left: 70px; right: 70px;
           display: flex; flex-direction: column; justify-content: center; }
  .texto .pre { font: 600 54px/1 var(--texto); letter-spacing: 2px; color: var(--marrom-medio); }
  .texto h1 { font: 900 132px/1 var(--titulo); letter-spacing: -2px; margin-top: 8px; }
  .texto p { font: 600 50px/1.2 var(--texto); margin-top: 24px; }
  .texto p b { font-weight: 700; }
  .faixa { bottom: 0; height: 96px; font-size: 42px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="peca post">
  <div class="foto"><img class="a-zoom" src="../../fotos/dobradinha.jpg" alt=""></div>
  <div class="logo-selo a-surge"><img src="../../marca/logo/barrio-logo-marrom.png" alt="Barrio Café e Bar"></div>
  <div class="selo a-carimbo">Prato<br>do dia</div>

  <div class="texto">
    <div class="pre a-sobe">HOJE TEM</div>
    <h1 class="a-sobe d1">Dobradinha</h1>
    <p class="a-sobe d2">Com <b>arroz, farofa e vinagrete</b></p>
  </div>

  <div class="faixa a-surge d3">Vem almoçar no Barrio</div>
</div>
</body>
</html>
