<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>14-artistas.html quadrado</title>
<link rel="stylesheet" href="../../../marca/barrio.css"><link rel="stylesheet" href="../../../marca/simbolos.css"><link rel="stylesheet" href="../carrossel.css">
<style>
.peca.quad { width:1080px; height:1080px; background: radial-gradient(110% 80% at 50% 40%, #fbd25a 0%, var(--mostarda-clara) 55%, var(--mostarda) 100%); }
.palco { position:absolute; left:108px; top:0; width:1080px; height:1350px; transform:scale(.8); transform-origin:0 0; }
</style></head><body>
<div class="peca quad" data-estatico><div class="palco">
  <div class="folheto papel xilo" style="top:40px;left:50px;right:50px;bottom:200px;padding:50px 60px;justify-content:space-between">
    <div style="font:700 34px/1 var(--texto);letter-spacing:8px;color:var(--marrom-medio)">NOSSO MUITO OBRIGADO</div>
    <div style="font:400 84px/1 var(--cartaz);color:var(--marrom)">AOS ARTISTAS</div>
    <div style="font:700 28px/1.2 var(--texto);letter-spacing:2px;border-top:2px solid var(--marrom);border-bottom:2px solid var(--marrom);padding:12px 6px 6px">PINTURA · GRAVURA · CERÂMICA · FOTOGRAFIA</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;column-gap:30px;row-gap:6px;text-align:left;font:700 42px/1.2 var(--titulo);color:var(--marrom)"><div>Antônio Melcop</div><div>Antônio Paes</div><div>George Barbosa</div><div>Lúcia Peebles</div><div>Mané Tatú</div><div>Marisa Lacerda</div><div>Pedro Dias</div><div>Tiago Amorim</div><div>Valéria Alcântara</div><div>Xirumba Amorim</div></div>
    <div style="font:600 34px/1.2 var(--texto);color:var(--marrom-medio)">e ao colaborador <b style="font:900 46px/1 var(--titulo);color:var(--marrom)">Laurindo de Pontes</b></div>
  </div>
  <div style="position:absolute;left:50px;right:200px;bottom:60px;font:900 44px/1.15 var(--titulo);color:var(--marrom)">Vocês fizeram esses 10 anos<br>ainda mais bonitos.</div>
  <div class="logo-barrio" style="right:40px;bottom:30px;width:130px;height:130px"><img src="../../../marca/logo/barrio-logo-creme.png" alt="Barrio Café e Bar"></div>
</div></div></body></html>
