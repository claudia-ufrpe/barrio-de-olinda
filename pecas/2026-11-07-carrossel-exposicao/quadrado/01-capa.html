<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>01-capa.html quadrado</title>
<link rel="stylesheet" href="../../../marca/barrio.css"><link rel="stylesheet" href="../../../marca/simbolos.css"><link rel="stylesheet" href="../carrossel.css">
<style>
.peca.quad { width:1080px; height:1080px; background: radial-gradient(110% 80% at 50% 40%, #fbd25a 0%, var(--mostarda-clara) 55%, var(--mostarda) 100%); }
.palco { position:absolute; left:108px; top:0; width:1080px; height:1350px; transform:scale(.8); transform-origin:0 0; }
</style></head><body>
<div class="peca quad" data-estatico><div class="palco">
  <div class="folheto papel xilo" style="top:40px;left:50px;right:50px;bottom:200px;padding:40px 50px;justify-content:space-between">
    <div class="convite" style="font:700 40px/1 var(--texto);letter-spacing:10px;color:var(--marrom-medio)">OBRIGADO!</div>
    <div class="gravura" style="width:92%"></div>
    <div><div style="font:400 104px/1 var(--cartaz);color:var(--marrom)">EXPOSIÇÃO</div>
      <div style="font:400 50px/1.1 var(--cartaz);color:var(--marrom);margin-top:8px">10 ANOS DO BARRIO</div>
      <div style="display:inline-block;background:var(--mostarda);font:700 28px/1 var(--texto);letter-spacing:4px;padding:10px 20px 6px;margin-top:14px">2016 – 2026</div></div>
    <div style="font:600 34px/1.15 var(--titulo);font-style:italic;color:var(--marrom-medio)">em memória de<b style="display:block;font:900 54px/1.1 var(--titulo);font-style:normal;color:var(--marrom)">José Carlos Viana</b></div>
  </div>
  <div style="position:absolute;left:50px;right:200px;bottom:52px;font:900 50px/1.1 var(--titulo);color:var(--marrom)">Obrigado pela presença<br>de todos e todas.</div>
  <div class="logo-barrio" style="right:40px;bottom:30px;width:130px;height:130px"><img src="../../../marca/logo/barrio-logo-creme.png" alt="Barrio Café e Bar"></div>
</div></div></body></html>
