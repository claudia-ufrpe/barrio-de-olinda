<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WhatsApp — Festa do Lula</title>
<link rel="stylesheet" href="../../marca/barrio.css">
<link rel="stylesheet" href="../../marca/simbolos.css">
<link rel="stylesheet" href="festa.css">
<style>.whats{width:1080px;height:1350px} .cartaz{padding:36px 0 34px;justify-content:space-between}
.estrela-xilo.grande{width:100px;height:100px} .estrela-xilo.p{width:40px;height:40px}
.chamada-festa{font-size:40px;padding:14px 36px 8px} .presidente{font-size:104px} .lula{font-size:200px;padding-top:18px}
.foto-lambe{padding:10px} .foto-lambe .janela{width:820px;height:300px} .selo-81{width:160px;height:160px;right:-40px;top:-50px;font-size:24px} .selo-81 b{font-size:80px}
.quando{font-size:64px;padding:16px 0 6px} .atracao{font-size:88px} .orq{font-size:50px} .conv{font-size:44px}
.couvert{font-size:36px;padding:12px 20px 6px} .couvert b{font-size:52px} .logos .snr,.logos .barrio{width:120px;height:120px}</style>
</head>
<body>
<div class="peca whats festa xilo" data-estatico>
  <div class="fundo-barrio"></div>
  <div class="cartaz">
    <div class="linha"><span class="estrela-xilo grande"></span><div class="chamada-festa">FESTA DO ANIVERSÁRIO<br>E DA VITÓRIA DO</div><span class="estrela-xilo grande"></span></div>
    <div class="faixa-txt presidente">PRESIDENTE</div>
    <div class="faixa-txt lula">LULA</div>
    <div class="foto-lambe"><div class="janela"><img class="" src="../../fotos/lula-carreata.jpg" alt=""></div>
      <span class="fita" style="top:-18px;left:40px;transform:rotate(-8deg)"></span><span class="fita" style="bottom:-18px;right:40px;transform:rotate(-6deg)"></span>
      <div class="selo-81">FAZ<b>81</b>ANOS</div></div>
    <div class="faixa-txt quando">TERÇA · 27/10 · 16h</div>
    <div class="faixa-txt atracao">SOM NA RURAL</div>
    <div class="faixa-txt orq">com a ORQUESTRA DE BABÁ</div>
    <div class="linha conv-linha"><span class="estrela-xilo p"></span><div class="faixa-txt conv">e CONVIDADOS</div><span class="estrela-xilo p"></span></div>
    <div class="rodape"><span class="couvert">COUVERT <b>R$ 5,00</b></span>
      <span class="logos"><img class="snr" src="../../marca/logo/som-na-rural.png" alt="Som na Rural"><span class="barrio"><img src="../../marca/logo/barrio-logo-creme.png" alt="Barrio Café e Bar"></span></span></div>
  </div>
</div>
</body>
</html>
