<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>WhatsApp — Obrigado Exposição</title>
<link rel="stylesheet" href="../../marca/barrio.css"><link rel="stylesheet" href="../../marca/simbolos.css">
<style>
.quad { width:1080px; height:1080px; background: radial-gradient(110% 80% at 50% 40%, #fbd25a 0%, var(--mostarda-clara) 55%, var(--mostarda) 100%); }
.topo { position:absolute; top:34px; left:40px; right:200px; }
.topo small { display:block; font:700 28px/1 var(--texto); letter-spacing:6px; color:var(--marrom-medio); }
.topo h1 { font:400 104px/1 var(--cartaz); color:var(--marrom); margin-top:10px; }
.topo .sub { display:inline-block; margin-top:10px; background:var(--marrom); color:var(--creme); font:400 32px/1 var(--cartaz); padding:14px 24px 8px; transform:rotate(-1deg); }
.logo-barrio { position:absolute; top:34px; right:40px; width:140px; height:140px; border-radius:50%; background:var(--marrom); display:grid; place-items:center; box-shadow:0 10px 22px rgba(74,42,26,.35); }
.logo-barrio img { width:66%; }
.retrato { position:absolute; background:var(--creme); padding:10px; box-shadow:0 14px 26px rgba(74,42,26,.3); }
.retrato img { width:100%; height:100%; object-fit:cover; object-position:50% 35%; display:block; }
.base { position:absolute; left:0; right:0; bottom:0; background:var(--marrom); color:var(--creme); text-align:center; padding:20px 20px 18px; }
.base b { display:block; font:900 46px/1.1 var(--titulo); }
.base span { display:block; font:700 30px/1.2 var(--texto); letter-spacing:2px; color:var(--mostarda-clara); margin-top:6px; }
</style></head><body>
<div class="peca quad" data-estatico>
  <div class="topo"><small>EXPOSIÇÃO 10 ANOS DO BARRIO</small><h1>OBRIGADO!</h1><div class="sub">pela presença de todos e todas</div></div>
  <div class="logo-barrio"><img src="../../marca/logo/barrio-logo-creme.png" alt="Barrio Café e Bar"></div>
  <div class="retrato" style="left:36px;top:290px;width:330px;height:600px;transform:rotate(-2deg)"><img src="../../fotos/expo-abertura/01.jpg" alt=""></div>
  <div class="retrato" style="left:375px;top:280px;width:330px;height:600px;transform:rotate(1deg)"><img src="../../fotos/expo-abertura/23.jpg" alt=""></div>
  <div class="retrato" style="left:714px;top:290px;width:330px;height:600px;transform:rotate(-1deg)"><img src="../../fotos/expo-abertura/26.jpg" alt=""></div>
  <div class="base"><b>A exposição continua</b><span>VISITAÇÃO DAS 11h ÀS 21h · BARRIO CAFÉ E BAR</span></div>
</div></body></html>
